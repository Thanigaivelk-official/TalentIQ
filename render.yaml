services:
  # TalentIQ Web Application
  - type: web
    name: talentiq
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: talentiq-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: LLM_PROVIDER
        value: "mock"
      - key: SECURE_SSL_REDIRECT
        value: "true"

  # Managed PostgreSQL Database
  - type: postgres
    name: talentiq-db
    region: oregon
    plan: free
    ipAllowList: []
