{% extends 'base.html' %}

{% block title %}Create Job Requisition – TalentIQ{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="glass-card p-4 p-md-5">
        <h3 class="text-white fw-bold mb-1">Create Job Requisition</h3>
        <p class="text-secondary small mb-4">Define technical skills, experience expectations, and role parameters</p>

        <form method="post" action="{% url 'job_create' %}">
          {% csrf_token %}
          <div class="row g-3 mb-3">
            <div class="col-md-8">
              <label class="form-label text-secondary small">Job Title *</label>
              <input type="text" name="title" class="form-control bg-dark text-white border-secondary" required placeholder="Senior Backend Python Engineer">
            </div>
            <div class="col-md-4">
              <label class="form-label text-secondary small">Department *</label>
              <input type="text" name="department" class="form-control bg-dark text-white border-secondary" required placeholder="Engineering">
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label text-secondary small">Employment Type</label>
              <select name="employment_type" class="form-select bg-dark text-white border-secondary">
                <option value="FULL_TIME">Full-time</option>
                <option value="CONTRACT">Contract</option>
                <option value="REMOTE">Remote</option>
                <option value="PART_TIME">Part-time</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label text-secondary small">Location</label>
              <input type="text" name="location" class="form-control bg-dark text-white border-secondary" value="Remote">
            </div>
            <div class="col-md-4">
              <label class="form-label text-secondary small">Min Experience (Years)</label>
              <input type="number" step="0.5" name="min_years_experience" class="form-control bg-dark text-white border-secondary" value="3.0">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label text-secondary small">Required Skills (Comma separated) *</label>
            <input type="text" name="required_skills" class="form-control bg-dark text-white border-secondary" required placeholder="Python, Django, PostgreSQL, Docker, REST API">
            <div class="form-text text-secondary small">Core criteria weighted in the matching engine.</div>
          </div>

          <div class="mb-3">
            <label class="form-label text-secondary small">Optional / Preferred Skills (Comma separated)</label>
            <input type="text" name="optional_skills" class="form-control bg-dark text-white border-secondary" placeholder="Redis, Celery, AWS, Kubernetes">
          </div>

          <div class="mb-4">
            <label class="form-label text-secondary small">Job Description *</label>
            <textarea name="description" rows="5" class="form-control bg-dark text-white border-secondary" required placeholder="Describe technical objectives, system scale, and responsibilities..."></textarea>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <a href="{% url 'job_list' %}" class="btn btn-talent-secondary">Cancel</a>
            <button type="submit" class="btn btn-talent-primary">Create Requisition</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
