{% extends 'base.html' %}

{% block title %}Sign In – TalentIQ{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="glass-card p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center gap-2 mb-2">
            <i data-lucide="cpu" class="text-cyan" style="width: 28px; height: 28px;"></i>
            <span class="fs-4 fw-bold text-white tracking-tight">Talent<span class="brand-accent">IQ</span></span>
          </div>
          <h1 class="h4 text-white fw-bold mb-1">Recruiter Console Sign In</h1>
          <p class="text-secondary-light small mb-0">Access candidate pipelines and match intelligence</p>
        </div>

        <form method="post" action="{% url 'login' %}">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label text-secondary-light small fw-medium" for="emailInput">Work Email Address</label>
            <input type="email" id="emailInput" name="username" class="form-control" required placeholder="recruiter@enterprise.com" autocomplete="email">
          </div>

          <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label text-secondary-light small fw-medium mb-0" for="passwordInput">Password</label>
            </div>
            <div class="position-relative">
              <input type="password" id="passwordInput" name="password" class="form-control pe-5" required placeholder="••••••••" autocomplete="current-password">
              <button type="button" class="btn btn-sm text-secondary-light position-absolute end-0 top-50 translate-middle-y me-2 border-0 bg-transparent p-1" id="togglePasswordBtn" aria-label="Toggle password visibility">
                <i data-lucide="eye" id="passwordEyeIcon" style="width: 18px; height: 18px;"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-talent-primary w-100 justify-content-center py-2 mb-3">
            Sign In to Console
          </button>
        </form>

        <div class="text-center mt-3 border-top border-secondary pt-3">
          <p class="text-secondary-light small mb-0">
            Don't have an enterprise account? 
            <a href="{% url 'register' %}" class="text-cyan text-decoration-none fw-medium hover-cyan">Register</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const passwordInput = document.getElementById('passwordInput');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const eyeIcon = document.getElementById('passwordEyeIcon');

    if (toggleBtn && passwordInput) {
      toggleBtn.addEventListener('click', function () {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        
        // Update eye icon state
        if (isPassword) {
          eyeIcon.setAttribute('data-lucide', 'eye-off');
        } else {
          eyeIcon.setAttribute('data-lucide', 'eye');
        }
        if (window.lucide) {
          lucide.createIcons();
        }
      });
    }
  });
</script>
{% endblock %}
